# keyd 設定 — SpaceFn レイヤー（US配列でHHKB風のFnレイヤーを再現）
#
# 真実はこのファイル（git管理）。/etc/keyd/default.conf へは chezmoi の
# run_onchange_after_install-keyd.sh.tmpl が sudo でコピー＆ keyd reload する。
# 編集したら:  chezmoi apply   （または: sudo keyd reload）
#
# 方針:
#   - CapsLock=Ctrl は xkb(ctrl:nocaps)で既に設定済み → keyd では触らない
#   - Space を二役に: 単押し=スペース / 長押し中=navレイヤー
#   - 矢印は hjkl（Vim）。右手はホームポジションから動かない
#   - トリガーは左親指(Space)なので、右手hjklと手が分離して渋滞しない

[ids]
*

[global]
# Space を長押し→レイヤー、と判定するまでの猶予(ms)。
# これより長く単独で押すとスペースを出さずレイヤー扱いになり、誤爆スペースを防ぐ。
overload_tap_timeout = 200

[main]
# 単押し=space / 長押し中=nav レイヤー
space = overload(nav, space)

[nav]
# Vim 矢印（右手ホーム段）
h = left
j = down
k = up
l = right
# ナビ・クラスタ（上段右手）
u = home
i = pagedown
o = pageup
p = end
# 数字段 → ファンクションキー
1 = f1
2 = f2
3 = f3
4 = f4
5 = f5
6 = f6
7 = f7
8 = f8
9 = f9
0 = f10
minus = f11
equal = f12
# 前方削除
backspace = delete
# 音量（右手下段: m=mute, ,=down . =up）
m = mute
comma = volumedown
dot = volumeup
# メディア再生（右手: [ =前曲 ] =次曲 \ =再生/一時停止）
leftbrace = previoussong
rightbrace = nextsong
backslash = playpause
# 画面輝度（ノート/DDC対応モニタのみ。デスクトップ外部モニタは効かない場合あり）
semicolon = brightnessdown
apostrophe = brightnessup
