<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>start</title>
<style>
  :root{
    --accent:#00ff9c; --accent2:#00e0ff; --accent3:#b026ff;
    --bg:#05070a; --fg:#c9d1d9;
    --font:"JetBrains Mono","Hack","Fira Code",monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--bg);overflow:hidden;font-family:var(--font);color:var(--fg)}
  #bg{position:fixed;inset:0;z-index:0}
  .ui{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:1.4rem;pointer-events:none}
  #clock{font-size:5.2rem;font-weight:700;letter-spacing:.08em;color:var(--accent);
      text-shadow:0 0 18px var(--accent),0 0 42px rgba(0,255,156,.35)}
  #date{font-size:1.05rem;letter-spacing:.35em;color:var(--accent2);text-transform:uppercase;opacity:.85}
  form{pointer-events:auto;display:flex;align-items:center;gap:.6rem;
      background:rgba(10,19,32,.55);border:1px solid #1b2330;border-radius:8px;
      padding:.7rem 1.1rem;min-width:min(560px,80vw);backdrop-filter:blur(4px);
      transition:border-color .2s, box-shadow .2s}
  form:focus-within{border-color:var(--accent);box-shadow:0 0 18px -2px var(--accent2)}
  .prompt{color:var(--accent);font-weight:700}
  input{flex:1;background:transparent;border:none;outline:none;color:var(--fg);
      font-family:var(--font);font-size:1.05rem}
  input::placeholder{color:#3a4658}
  ::selection{background:var(--accent);color:#000}
</style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="ui">
    <div id="clock">--:--</div>
    <div id="date"></div>
    <form id="search" autocomplete="off">
      <span class="prompt">&gt;</span>
      <input id="q" placeholder="search the net…" autofocus spellcheck="false">
    </form>
  </div>

  <script src="./vendor/three.min.js"></script>
  <script>
  /* ── 時計 ── */
  const pad=n=>String(n).padStart(2,'0');
  const days=['SUN','MON','TUE','WED','THU','FRI','SAT'];
  function tick(){
    const d=new Date();
    document.getElementById('clock').textContent=`${pad(d.getHours())}:${pad(d.getMinutes())}`;
    document.getElementById('date').textContent=
      `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}  ${days[d.getDay()]}`;
  }
  tick(); setInterval(tick,1000*15);

  /* ── 検索 (Google。URLっぽければ直接開く) ── */
  document.getElementById('search').addEventListener('submit',e=>{
    e.preventDefault();
    const v=document.getElementById('q').value.trim(); if(!v)return;
    const isUrl=/^https?:\/\//.test(v)||/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(v);
    location.href=isUrl?(/^https?:\/\//.test(v)?v:'https://'+v)
                       :'https://www.google.com/search?q='+encodeURIComponent(v);
  });

  /* ── three.js: 漂うネオンのパーティクル・ネットワーク ── */
  const cv=document.getElementById('bg');
  const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  const scene=new THREE.Scene();
  scene.fog=new THREE.FogExp2(0x05070a,0.055);
  const camera=new THREE.PerspectiveCamera(70,1,0.1,100);
  camera.position.z=14;

  const N=130, SPREAD=22;
  const pos=new Float32Array(N*3), vel=[];
  for(let i=0;i<N;i++){
    pos[i*3]  =(Math.random()-.5)*SPREAD;
    pos[i*3+1]=(Math.random()-.5)*SPREAD;
    pos[i*3+2]=(Math.random()-.5)*SPREAD;
    vel.push(new THREE.Vector3((Math.random()-.5)*.012,(Math.random()-.5)*.012,(Math.random()-.5)*.012));
  }
  const pGeo=new THREE.BufferGeometry();
  pGeo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const points=new THREE.Points(pGeo,new THREE.PointsMaterial({
    color:0x00ff9c,size:0.16,transparent:true,opacity:.9,
    blending:THREE.AdditiveBlending,depthWrite:false}));
  scene.add(points);

  const LINK=4.2, maxLines=N*N;
  const linePos=new Float32Array(maxLines*3);
  const lGeo=new THREE.BufferGeometry();
  lGeo.setAttribute('position',new THREE.BufferAttribute(linePos,3));
  const lines=new THREE.LineSegments(lGeo,new THREE.LineBasicMaterial({
    color:0x00e0ff,transparent:true,opacity:.22,
    blending:THREE.AdditiveBlending,depthWrite:false}));
  scene.add(lines);

  const mouse={x:0,y:0};
  addEventListener('pointermove',e=>{mouse.x=(e.clientX/innerWidth-.5);mouse.y=(e.clientY/innerHeight-.5)});

  function resize(){
    const w=innerWidth,h=innerHeight;
    renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
  }
  addEventListener('resize',resize);resize();

  let t=0;
  (function loop(){
    requestAnimationFrame(loop);t+=0.0015;
    const p=pGeo.attributes.position.array, h=SPREAD/2;
    for(let i=0;i<N;i++){
      for(let a=0;a<3;a++){
        p[i*3+a]+=vel[i].getComponent(a);
        if(p[i*3+a]> h||p[i*3+a]<-h) vel[i].setComponent(a,-vel[i].getComponent(a));
      }
    }
    pGeo.attributes.position.needsUpdate=true;
    // 近接ノードを線で結ぶ
    let k=0;
    for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){
      const dx=p[i*3]-p[j*3],dy=p[i*3+1]-p[j*3+1],dz=p[i*3+2]-p[j*3+2];
      if(dx*dx+dy*dy+dz*dz<LINK*LINK){
        linePos[k++]=p[i*3];linePos[k++]=p[i*3+1];linePos[k++]=p[i*3+2];
        linePos[k++]=p[j*3];linePos[k++]=p[j*3+1];linePos[k++]=p[j*3+2];
      }
    }
    lGeo.setDrawRange(0,k/3);lGeo.attributes.position.needsUpdate=true;
    // ゆっくり周回＋マウス視差
    camera.position.x+=((Math.sin(t)*6+mouse.x*6)-camera.position.x)*.04;
    camera.position.y+=((Math.cos(t)*4-mouse.y*5)-camera.position.y)*.04;
    camera.lookAt(scene.position);
    points.rotation.y=t*0.4;lines.rotation.y=t*0.4;
    renderer.render(scene,camera);
  })();
  </script>
</body>
</html>
