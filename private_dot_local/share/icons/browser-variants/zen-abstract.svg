<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Zen用オリジナル抽象アイコン: 白ベースのグラデ地に ダークレッドのオービット -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f6eef0"/>
      <stop offset="1" stop-color="#efe1e5"/>
    </linearGradient>
    <linearGradient id="red" x1="0.05" y1="0.1" x2="0.95" y2="0.95">
      <stop offset="0" stop-color="#7a0b1e"/>
      <stop offset="0.5" stop-color="#c0102e"/>
      <stop offset="1" stop-color="#e8364f"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="57.5" fill="none" stroke="#7a0b1e" stroke-opacity="0.12"/>
  <g fill="none" stroke="url(#red)" stroke-linecap="round" filter="url(#glow)">
    <path d="M70 162 A 66 66 0 1 1 188 116" stroke-width="15"/>
    <path d="M156 198 A 74 74 0 0 1 74 66" stroke-width="9" stroke-opacity="0.78"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="188" cy="116" r="12" fill="#c0102e"/>
    <circle cx="70" cy="162" r="7.5" fill="#e8364f"/>
    <circle cx="156" cy="198" r="6.5" fill="#7a0b1e"/>
  </g>
</svg>
