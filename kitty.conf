# kitty_mod = ctrl+shift (default). iTerm2 の Cmd 相当として使う。
# (shell の Ctrl+key と衝突しないため)
kitty_mod ctrl+shift

# ============================================================
# タブ (iTerm2: Cmd+T / Cmd+W / Cmd+] / Cmd+1..9)
# ============================================================
map kitty_mod+t      new_tab_with_cwd
map kitty_mod+w      close_tab
map kitty_mod+]      next_tab
map kitty_mod+[      previous_tab
map kitty_mod+1      goto_tab 1
map kitty_mod+2      goto_tab 2
map kitty_mod+3      goto_tab 3
map kitty_mod+4      goto_tab 4
map kitty_mod+5      goto_tab 5
map kitty_mod+6      goto_tab 6
map kitty_mod+7      goto_tab 7
map kitty_mod+8      goto_tab 8
map kitty_mod+9      goto_tab 9
# 既存: ctrl+F4 でタブを別ウィンドウへ切り出し
map ctrl+f4          detach_tab ask

# ============================================================
# 分割ペイン (iTerm2: Cmd+D 縦分割 / Cmd+Shift+D 横分割)
# ============================================================
# kitty_mod+d → 右側に縦分割 (Cmd+D)
map kitty_mod+d      launch --location=vsplit --cwd=current
# kitty_mod+shift+d → 下に横分割 (Cmd+Shift+D)
# kitty では shift+d も kitty_mod に含まれてしまうため、別キー e を補助に当てる
map kitty_mod+e      launch --location=hsplit --cwd=current

# ペイン移動 (iTerm2: Cmd+Opt+Arrow)
map kitty_mod+left   neighboring_window left
map kitty_mod+right  neighboring_window right
map kitty_mod+up     neighboring_window up
map kitty_mod+down   neighboring_window down

# ペインサイズ変更
map kitty_mod+alt+left   resize_window narrower
map kitty_mod+alt+right  resize_window wider
map kitty_mod+alt+up     resize_window taller
map kitty_mod+alt+down   resize_window shorter

# ============================================================
# フォント (iTerm2: Cmd+Plus / Cmd+Minus / Cmd+0)
# ============================================================
map kitty_mod+plus       change_font_size all +2.0
map kitty_mod+equal      change_font_size all +2.0
map kitty_mod+minus      change_font_size all -2.0
map kitty_mod+0          change_font_size all 0

# ============================================================
# 検索 / スクロールバック (iTerm2: Cmd+F)
# ============================================================
map kitty_mod+f          show_scrollback

# ============================================================
# 画面クリア (iTerm2: Cmd+K)
# ============================================================
map kitty_mod+k          clear_terminal scrollback active

# ============================================================
# フルスクリーン (iTerm2: Cmd+Enter)
# (kitty_mod+enter は既定で new_window に使われるので F11 で)
# ============================================================
map kitty_mod+f11        toggle_fullscreen

# ============================================================
# コピー / 貼付け (iTerm2: Cmd+C / Cmd+V)
# kitty default と同じだが明示
# ============================================================
map kitty_mod+c          copy_to_clipboard
map kitty_mod+v          paste_from_clipboard

# ============================================================
# シェル
# ============================================================
shell /bin/zsh

# ============================================================
# 表示
# ============================================================
font_family      MonaspiceNe Nerd Font
bold_font        MonaspiceNe Nerd Font Bold
italic_font      MonaspiceNe Nerd Font Italic
bold_italic_font MonaspiceNe Nerd Font Bold Italic
font_size 12.0

# 字間・行間を詰める
modify_font cell_width  -1px
modify_font cell_height -1px

# 日本語フォールバック (ひらがな/カタカナ/CJK統合漢字)
symbol_map U+3000-U+30FF,U+4E00-U+9FFF,U+FF00-U+FFEF Noto Sans Mono CJK JP

enable_audio_bell no
scrollback_lines 10000
